name: Release stale claims

# Unassigns issues that have had no activity and no linked PR for 7 days.
# Exempt: issues labelled `on-hold`, and issues assigned only to the repo owner.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const DAYS = 7;
            const cutoff = Date.now() - DAYS * 24 * 60 * 60 * 1000;

            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', assignee: '*', per_page: 100,
            });

            for (const issue of issues) {
              if (issue.pull_request) continue;
              if (issue.labels.some((l) => (typeof l === 'string' ? l : l.name) === 'on-hold')) continue;
              if (new Date(issue.updated_at).getTime() > cutoff) continue;

              const names = issue.assignees.map((a) => a.login);
              if (names.every((n) => n.toLowerCase() === owner.toLowerCase())) continue;

              const n = issue.number;
              const branchRe = new RegExp(`^[a-z]+/${n}-`);
              const refRe = new RegExp(`#${n}(?!\\d)`);
              const hasPr = prs.some(
                (pr) => branchRe.test(pr.head.ref) || refRe.test(`${pr.title} ${pr.body ?? ''}`)
              );
              if (hasPr) continue;

              await github.rest.issues.removeAssignees({ owner, repo, issue_number: n, assignees: names });
              await github.rest.issues.createComment({
                owner, repo, issue_number: n,
                body:
                  `Released the claim by ${names.map((x) => '@' + x).join(', ')}: ` +
                  `no activity or linked PR for ${DAYS} days. Comment \`/claim\` to take it again.`,
              });
            }
